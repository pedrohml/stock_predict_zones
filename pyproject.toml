[project]
name = "stock-predict-zones"
version = "0.1.0"
description = "Support and resistance zones with probabilities from price candles"
readme = "README.md"
authors = [
    { name = "Pedro Lira", email = "pedrohml@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "yfinance>=1.8.0",
]

# `zones` is run_pipeline.py's main(). The code stays where it is (flat scripts
# plus the project skill), so only an editable install works: `uv sync` makes
# one, and so does `uv tool install --editable .` for a global command.
[project.scripts]
zones = "run_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["run_pipeline.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
